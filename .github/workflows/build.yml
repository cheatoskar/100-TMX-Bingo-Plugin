name: build

# Every push builds the DLL on a clean machine, which is the only way to know
# the repo really contains everything needed to build it. A tag also cuts a
# release, so "download the mod" never means "clone it and install Visual
# Studio".
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # TrackMania Forever is a 32-bit process, so the DLL must be Win32. The
      # runner has MSVC and CMake already; nothing else is needed.
      - name: Configure
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Collect
        run: |
          mkdir out
          copy build\Release\100TMX.dll out\
          copy build\Release\100TMX.asi out\
          copy README.md out\

      - uses: actions/upload-artifact@v4
        with:
          name: 100TMX-mod
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/100TMX.dll
            out/100TMX.asi
          generate_release_notes: true

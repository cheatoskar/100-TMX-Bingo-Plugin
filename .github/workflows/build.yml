name: build

# Every push builds the DLL on a clean machine, which is the only way to know
# the repo really contains everything needed to build it. A tag also cuts a
# release, so "download the mod" never means "clone it and install Visual
# Studio".
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the tag build attaches the DLL to a release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # TrackMania Forever is a 32-bit process, so the DLL must be Win32. The
      # runner has MSVC and CMake already; nothing else is needed.
      # The tag is the version, when there is one. Without this the installer
      # registers whatever CMakeLists last said, which is how it sat at 0.5.0
      # through four releases - a second place to remember is a place that goes
      # stale.
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: >
          cmake -S . -B build -A Win32
          ${{ steps.v.outputs.value && format('-DTMX_VERSION={0}', steps.v.outputs.value) || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Collect
        run: |
          mkdir out
          copy build\Release\100TMX-Installer.exe out\
          copy build\Release\100TMX.dll out\
          copy build\Release\100TMX.asi out\
          copy README.md out\

      - uses: actions/upload-artifact@v4
        with:
          name: 100TMX-mod
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/100TMX-Installer.exe
            out/100TMX.dll
            out/100TMX.asi
          # A release missing the file everybody is told to download should fail
          # the build, not publish quietly without it - which is exactly what
          # v0.2.0 did.
          fail_on_unmatched_files: true
          generate_release_notes: true

name: build

# Every push builds the DLL on a clean machine, which is the only way to know
# the repo really contains everything needed to build it. A tag also cuts a
# release, so "download the mod" never means "clone it and install Visual
# Studio".
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the tag build attaches the DLL to a release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The tag is the version, when there is one. Without this the installer
      # registers whatever CMakeLists last said, which is how it came to sit at
      # 0.5.0 through four releases - a second place to remember is a place that
      # goes stale.
      #
      # The step emits the whole flag rather than the bare number, so the
      # Configure line below needs no conditional expression: on a branch build
      # it is simply empty and CMakeLists' own version stands.
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "flag=-DTMX_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # TrackMania Forever is a 32-bit process, so the DLL must be Win32. The
      # runner has MSVC and CMake already; nothing else is needed.
      - name: Configure
        run: cmake -S . -B build -A Win32 ${{ steps.v.outputs.flag }}

      # Four releases went out whose installer did not carry its own version
      # number, and every guess at why was wrong because nothing ever printed
      # it. So the build says what it decided, and then proves it.
      - name: Show the configured version
        shell: pwsh
        run: |
          Write-Host "flag was: '${{ steps.v.outputs.flag }}'"
          Get-Content build/tmx_version.h | Select-Object -Last 3

      - name: Build
        run: cmake --build build --config Release

      # The only thing that actually matters: the string is in the binary that
      # ships. A wide literal, so the file is searched as Unicode.
      - name: Verify the installer carries it
        shell: pwsh
        run: |
          $line = Select-String -Path build/tmx_version.h -Pattern 'L"(.*)"'
          $want = $line.Matches[0].Groups[1].Value
          Write-Host "expecting: '$want'"
          if (-not $want) { Write-Error "no version was configured at all"; exit 1 }
          $hit = Select-String -Path build/Release/100TMX-Installer.exe -Pattern $want -Encoding unicode -Quiet
          if ($hit) { Write-Host "OK - the installer carries $want" }
          else { Write-Error "the installer does not contain $want"; exit 1 }

      - name: Collect
        run: |
          mkdir out
          copy build\Release\100TMX-Installer.exe out\
          copy build\Release\100TMX.dll out\
          copy build\Release\100TMX.asi out\
          copy README.md out\

      - uses: actions/upload-artifact@v4
        with:
          name: 100TMX-mod
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/100TMX-Installer.exe
            out/100TMX.dll
            out/100TMX.asi
          # A release missing the file everybody is told to download should fail
          # the build, not publish quietly without it - which is exactly what
          # v0.2.0 did.
          fail_on_unmatched_files: true
          generate_release_notes: true

name: build

# Every push builds the DLL on a clean machine, which is the only way to know
# the repo really contains everything needed to build it. A tag also cuts a
# release, so "download the mod" never means "clone it and install Visual
# Studio".
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the tag build attaches the DLL to a release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The tag is the version, when there is one. Without this the installer
      # registers whatever CMakeLists last said, which is how it came to sit at
      # 0.5.0 through four releases - a second place to remember is a place that
      # goes stale.
      #
      # The step emits the whole flag rather than the bare number, so the
      # Configure line below needs no conditional expression: on a branch build
      # it is simply empty and CMakeLists' own version stands.
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "flag=-DTMX_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # TrackMania Forever is a 32-bit process, so the DLL must be Win32. The
      # runner has MSVC and CMake already; nothing else is needed.
      #
      # bash, not the default PowerShell, and this is the whole bug that made
      # five releases install themselves as version "0". PowerShell mangles an
      # unquoted `-DTMX_VERSION=0.6.9` into `-DTMX_VERSION=0`; quoted it is
      # fine. Every local test quoted it and passed, CI never did and never
      # passed, and the difference was invisible because nothing printed the
      # result. bash splits on whitespace and leaves the token alone.
      - name: Configure
        shell: bash
        run: cmake -S . -B build -A Win32 ${{ steps.v.outputs.flag }}

      # Four releases went out whose installer did not carry its own version
      # number, and every guess at why was wrong because nothing ever printed
      # it. So the build says what it decided, and then proves it.
      - name: Show the configured version
        shell: pwsh
        run: |
          Write-Host "flag was: '${{ steps.v.outputs.flag }}'"
          Get-Content build/tmx_version.h | Select-Object -Last 3

      - name: Build
        run: cmake --build build --config Release

      # The only thing that actually matters: the string is in the binary that
      # ships. A wide literal, so the file is searched as Unicode.
      - name: Verify the installer carries it
        shell: pwsh
        run: |
          $line = Select-String -Path build/tmx_version.h -Pattern '^#define TMX_VERSION L"(.+)"$'
          if (-not $line) { Write-Error "no #define TMX_VERSION in the generated header"; exit 1 }
          $want = $line.Matches[0].Groups[1].Value
          Write-Host "expecting: '$want'"
          # It has to look like a version. The check used to accept whatever was
          # there and then search the binary for it - so when the version came
          # out as "0", it happily found a "0" in a megabyte of machine code and
          # called that a pass. Five releases shipped through that hole.
          if ($want -notmatch '^\d+\.\d+\.\d+') {
            Write-Host "::error::the configured version is '$want', which is not a version"
            exit 1
          }
          # Bytes, not Select-String. Its binary and encoding behaviour differs
          # between Windows PowerShell and pwsh, which is why this check passed
          # in CI and failed against the very same file locally - the checking
          # was wronger than the thing being checked.
          $bytes = [System.IO.File]::ReadAllBytes("build/Release/100TMX-Installer.exe")
          $text  = [System.Text.Encoding]::Unicode.GetString($bytes)
          if ($text.Contains($want)) {
            Write-Host "OK - the installer carries $want"
          } else {
            Write-Host "::error::the installer does not contain '$want' ($($bytes.Length) bytes built)"
            exit 1
          }

      - name: Collect
        run: |
          mkdir out
          copy build\Release\100TMX-Installer.exe out\
          copy build\Release\100TMX.dll out\
          copy build\Release\100TMX.asi out\
          copy build\tmx_version.h out\
          copy README.md out\

      # A fingerprint of every file, so anybody can check that what they
      # downloaded is byte for byte what this build produced - the honest answer
      # to "a scanner flagged it, is it really yours?". Written twice: as
      # SHA256SUMS.txt next to the files, and as a table at the top of the
      # release notes, where people actually look.
      - name: Hashes
        shell: pwsh
        run: |
          $files = "100TMX-Installer.exe", "100TMX.dll", "100TMX.asi", "tmx_version.h"
          $sums = foreach ($f in $files) {
            $h = (Get-FileHash "out/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $sums | Set-Content -Encoding ascii out/SHA256SUMS.txt
          $body = @(
            "### SHA-256"
            ""
            "| File | SHA-256 |"
            "|---|---|"
          )
          foreach ($line in $sums) {
            $h, $f = $line -split "  ", 2
            $body += "| ``$f`` | ``$h`` |"
          }
          $body += ""
          $body += "Check a download in PowerShell: ``Get-FileHash .\100TMX-Installer.exe -Algorithm SHA256``"
          $body | Set-Content -Encoding utf8 out/release-notes.md
          Get-Content out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: 100TMX-mod
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/100TMX-Installer.exe
            out/100TMX.dll
            out/100TMX.asi
            out/tmx_version.h
            out/SHA256SUMS.txt
          # The hash table first; GitHub's generated notes are appended below it.
          body_path: out/release-notes.md
          # A release missing the file everybody is told to download should fail
          # the build, not publish quietly without it - which is exactly what
          # v0.2.0 did.
          fail_on_unmatched_files: true
          generate_release_notes: true
